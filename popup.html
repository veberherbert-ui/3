<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      p {
        font-size: 12px;
        color: #666;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #965eeb;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #7d45d1;
      }
      .note {
        font-size: 11px;
        color: #999;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h1>🔎 Авито Парсер</h1>
    <p>Откройте страницу поиска на avito.ru и нажмите кнопку ниже, чтобы показать или скрыть панель фильтров.</p>
    <button id="toggle">Показать / скрыть панель</button>
    <div class="note" id="note"></div>
    <script src="popup.js"></script>
  </body>
</html>
