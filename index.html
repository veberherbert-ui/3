<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — чтобы приложение занимало экран целиком под «чёлкой» iPhone.
         Зум пальцами не запрещаем: iOS Safari этот запрет игнорирует с версии 10,
         так что он отнимал жест только у пользователей Android. Назойливое
         увеличение при вводе лечится размером шрифта в полях, а не запретом. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15171B" />
    <!-- Приложение тёмное всегда, и об этом надо сказать браузеру, а не только
         покрасить свои элементы. Всё, что рисует сам браузер, — системная
         полоса навигации внизу андроида, полосы прокрутки, календарь в поле
         даты — берёт цвета отсюда. Без этой строки страница считается светлой:
         тёмное приложение получало снизу белую полосу во весь экран.
         Мета-тегом, а не только в CSS: он действует до загрузки стилей,
         и первый кадр запуска тоже тёмный, без белой вспышки. -->
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Трекер силовых тренировок: журнал, прогресс, замеры тела. Работает офлайн." />

    <!-- iOS: запуск с домашнего экрана без адресной строки -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Дневник" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <title>Железный дневник</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Экран поломки.

         Если приложение не запустится — не разберётся файл на старом
         телефоне, оборвётся загрузка, упадёт первый же рендер, — человек
         видел белый экран и ничего больше. Ни он, ни тот, кому он об этом
         скажет, не могли узнать даже, дошло ли дело до выполнения кода.

         Поэтому разметка ниже лежит прямо в странице и не зависит ни от
         одного скрипта. Обычный скрипт (не module) её показывает: браузер,
         который не понял современный синтаксис в модуле, этот файл разберёт
         в любом случае. Если приложение поднялось — блок убирается. -->
    <div id="crash" hidden style="position:fixed;inset:0;padding:24px;background:#15171B;color:#EDEAE3;font:16px/1.5 system-ui,-apple-system,sans-serif;overflow:auto">
      <h1 style="font-size:20px;margin:0 0 12px">Приложение не запустилось</h1>
      <p id="crash-why" style="margin:0 0 16px;color:#8A9099"></p>
      <button id="crash-fix" style="display:block;width:100%;padding:14px;margin:0 0 8px;border:0;border-radius:12px;background:#B5453C;color:#EDEAE3;font:600 16px/1 system-ui,-apple-system,sans-serif">Починить и перезапустить</button>
      <button id="crash-copy" style="display:block;width:100%;padding:12px;margin:0 0 16px;border:1px solid #2E3339;border-radius:12px;background:#1C1F24;color:#8A9099;font:14px/1 system-ui,-apple-system,sans-serif">Скопировать сведения об ошибке</button>
      <p style="margin:0 0 6px;color:#8A9099;font-size:14px">Записи тренировок при починке не пострадают — стирается
        только скачанная копия приложения, а дневник лежит отдельно.</p>
      <pre id="crash-info" style="white-space:pre-wrap;word-break:break-word;background:#1C1F24;padding:12px;border-radius:8px;font-size:13px;margin:0;color:#8A9099"></pre>
    </div>

    <script>
      (function () {
        var BUILD = "__BUILD__";
        var shown = false;

        /* Стереть скачанную копию приложения и перезапуститься.

           Установленное приложение умеет само себя заклинить: служебный
           поток отдаёт из кеша старую разметку, а файлы, на которые она
           ссылается, к этому времени уже стёрты и с устройства, и с сервера.
           Получается белый экран навсегда, и выйти из него можно было только
           удалив значок с экрана. Теперь выход есть. Данные лежат
           в IndexedDB и не трогаются. */
        function heal() {
          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) { /* нечего чистить */ }
          var again = function () { location.reload(); };
          if (!jobs.length) return again();
          Promise.all(jobs).then(again, again);
        }

        var healedOnce = false;
        try { healedOnce = sessionStorage.getItem("iron-healed") === "1"; } catch (e) {}

        function fail(what) {
          /* Первый сбой чиним молча: почти всегда это застрявшая копия,
             и показывать человеку разбирательство незачем. Если и после
             починки не поднялось — значит дело не в ней, и вот тогда
             объясняем. */
          if (!healedOnce) {
            healedOnce = true;
            try { sessionStorage.setItem("iron-healed", "1"); } catch (e) {}
            return heal();
          }
          show(what);
        }

        function show(what) {
          if (shown) return;
          shown = true;
          var box = document.getElementById("crash");
          if (!box) return;
          box.hidden = false;
          document.getElementById("crash-why").textContent =
            "Приложение уже пробовало починиться само, но не помогло. "
            + "Попробуйте открыть ссылку в другом браузере — а эти сведения "
            + "перешлите тому, кто дал вам ссылку.";
          var info = [what, "сборка " + BUILD, navigator.userAgent].join("\n");
          document.getElementById("crash-info").textContent = info;
          document.getElementById("crash-fix").onclick = heal;
          document.getElementById("crash-copy").onclick = function () {
            try {
              navigator.clipboard.writeText(info);
              this.textContent = "Скопировано";
            } catch (e) {
              this.textContent = "Скопировать не вышло — выделите текст ниже";
            }
          };
        }

        /* Фаза захвата обязательна: сбой загрузки самого файла происходит
           на теге script и до window иначе не доходит. */
        window.addEventListener("error", function (e) {
          if (e && e.target && e.target !== window && e.target.src) {
            fail("не загрузился файл: " + e.target.src);
            return;
          }
          fail((e && e.message) || "неизвестная ошибка");
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          fail("сбой загрузки: " + ((e && e.reason && e.reason.message) || e.reason || "?"));
        });
        /* Ничего не упало, но и не нарисовалось — значит скрипт не дошёл. */
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (!root || root.childElementCount === 0) fail("приложение не отрисовалось за 6 секунд");
          }, 6000);
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
